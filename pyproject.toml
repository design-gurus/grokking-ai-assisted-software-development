[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "review-assistant"
version = "0.2.0"
description = "A pull request review assistant: the shared codebase for Grokking AI-Assisted Software Development."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12",
    "sqlalchemy>=2,<3",
    "alembic>=1.13",
    "httpx>=0.27",
    "fastapi>=0.110",
    # Pinned below the current major on purpose: the upgrade is the course's migration lesson.
    "anthropic>=0.125,<1",
    "openai>=3,<4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mutmut>=3",
    "types-PyYAML",
    # The library diff parser the testing module uses as the oracle for the hand-written one.
    "unidiff>=0.7",
]

[project.scripts]
review-assistant = "review_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["labs/05/drill"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"src/review_assistant/cli.py" = ["B008"]
"alembic/versions/*" = ["D"]
"labs/checks/*" = ["D", "E501"]
"scripts/*" = ["D", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/review_assistant", "tests", "alembic/env.py"]

[[tool.mypy.overrides]]
module = ["unidiff.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hypothesis]
derandomize = true

[tool.mutmut]
# The two named targets of the Test bar. Run: mutmut run; mutmut results
paths_to_mutate = ["src/review_assistant/findings/filter.py", "src/review_assistant/ledger/cost.py"]
tests_dir = ["tests/"]
