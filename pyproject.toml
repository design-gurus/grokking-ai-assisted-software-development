[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "review-assistant"
version = "0.1.0"
description = "A pull request review assistant: the shared codebase for Grokking AI-Assisted Software Development."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12",
    "sqlalchemy>=2,<3",
    "alembic>=1.13",
    "httpx>=0.27",
    # Pinned below the current major on purpose: the upgrade is the course's migration lesson.
    "anthropic>=0.125,<1",
    "openai>=3,<4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mutmut>=3",
    "types-PyYAML",
]

[project.scripts]
review-assistant = "review_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/review_assistant", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hypothesis]
derandomize = true
